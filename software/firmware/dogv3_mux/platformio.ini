; DogV3 onboard ESP32 firmware.
; Current implemented behavior is the transparent dual-UART transport used by
; D1 commissioning and D2 Home-PC operation/tuning. Flash this single firmware
; to the ESP32 mounted on the robot, then run the host `verify_firmware` CLI
; before trusting it.
;
;   esp32dev    : USB-only onboard transport.
[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 1000000
build_flags =
    -D FIRMWARE_VERSION="\"DOGV3-MUX v1.0\""

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
build_src_filter =
    +<dogv3_core.cpp>
    +<dogv3_state.cpp>
    +<dogv3_config_blob.cpp>
    -<main.cpp>
